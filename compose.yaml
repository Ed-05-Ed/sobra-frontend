services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sobra}
      POSTGRES_USER: ${POSTGRES_USER:-sobra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sobra_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sobra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sobra} -d ${POSTGRES_DB:-sobra}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sobra_postgres_data:
